<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Little Compliments ✨</title>

    <!-- Bootstrap 5 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main
      class="container min-vh-100 d-flex justify-content-center align-items-center"
    >
      <div class="compliment-card text-center p-4 p-md-5">
        <div class="sun">☀️</div>

        <p class="small-heading">A LITTLE SOMETHING FOR YOU</p>

        <h1>Hey, you! 🌷</h1>

        <p class="description">
          Need a little happiness today? Tap the button and get a random
          compliment! ✨
        </p>

        <div id="complimentBox" aria-live="polite">
          <span class="quote">❝</span>
          <p id="compliment">You deserve a little happiness today. 💛</p>
        </div>

        <button id="newCompliment" class="btn compliment-btn">
          Give me a compliment ✨
        </button>

        <p class="footer">A little positivity goes a long way ♡</p>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
